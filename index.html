// Connects the site to your Firebase project — Firestore for content storage,
// Firebase Authentication for the admin login.
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyDMgttCTjm2bxPJZtGjAWexUTY1eLtsS5c",
    authDomain: "nasfat-peel-region.firebaseapp.com",
    projectId: "nasfat-peel-region",
    storageBucket: "nasfat-peel-region.firebasestorage.app",
    messagingSenderId: "643411569925",
    appId: "1:643411569925:web:0edf01e3a22f99e3241b6c",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // Must match the Firestore security rules (allow public read, auth-only write).
  const COLLECTION = "storage_shared";

  window.firebaseAuth = auth;
  window.firebaseDb = db;
  window.ADMIN_EMAIL = "admin@nasfatpeelregion.org";

  window.storage = {
    async get(key) {
      const snap = await db.collection(COLLECTION).doc(key).get();
      if (!snap.exists) {
        throw new Error(`No value found for key "${key}"`);
      }
      return { key, value: snap.data().value, shared: true };
    },
    async set(key, value) {
      await db.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared: true };
    },
    async delete(key) {
      const ref = db.collection(COLLECTION).doc(key);
      const snap = await ref.get();
      const existed = snap.exists;
      await ref.delete();
      return { key, deleted: existed, shared: true };
    },
    async list(prefix = "") {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((doc) => {
        if (doc.id.startsWith(prefix)) keys.push(doc.id);
      });
      return { keys, prefix, shared: true };
    },
  };
})();

</script>

const STAR_POINTS = (() => {
  // generates an 8-point star path
  const pts = [];
  const outerR = 50, innerR = 21, cx = 50, cy = 50;
  for (let i = 0; i < 16; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / 8) * i - Math.PI / 2;
    pts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
  }
  return pts.join(" ");
})();

function Star({ size = 24, color = C.gold, opacity = 1, className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" className={className} style={{ opacity }}>
      <polygon points={STAR_POINTS} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" />
    </svg>
  );
}

function GalleryCarousel({ gallery }) {
  const [index, setIndex] = useState(0);
  const [paused, setPaused] = useState(false);

  // keep index in range if photos are removed in admin while viewing
  useEffect(() => {
    if (index >= gallery.length) setIndex(0);
  }, [gallery.length, index]);

  // auto-advance through every photo, pausing while a visitor is looking closely
  useEffect(() => {
    if (gallery.length <= 1 || paused) return;
    const t = setInterval(() => setIndex((i) => (i + 1) % gallery.length), 4500);
    return () => clearInterval(t);
  }, [gallery.length, paused]);

  if (gallery.length === 0) return null;

  const goTo = (i) => setIndex(((i % gallery.length) + gallery.length) % gallery.length);

  return (
    <div
      onMouseEnter={() => setPaused(true)}
      onMouseLeave={() => setPaused(false)}
      style={{
        position: "relative",
        maxWidth: 780,
        margin: "0 auto",
        borderRadius: 6,
        overflow: "hidden",
        background: C.stoneDim,
        boxShadow: "0 12px 40px rgba(0,0,0,0.12)",
      }}
    >
      <div style={{ position: "relative", width: "100%", paddingTop: "62%" }}>
        {gallery.map((g, i) => (
          <img
            key={i}
            src={g.url}
            alt={g.caption || ""}
            style={{
              position: "absolute",
              inset: 0,
              width: "100%",
              height: "100%",
              objectFit: "cover",
              opacity: i === index ? 1 : 0,
              transition: "opacity 1.1s ease",
            }}
          />
        ))}
        {gallery[index]?.caption && (
          <div
            style={{
              position: "absolute",
              left: 0,
              right: 0,
              bottom: 0,
              padding: "40px 24px 18px",
              background: "linear-gradient(transparent, rgba(10,43,44,0.85))",
            }}
          >
            <div style={{ color: C.stone, fontSize: 14, fontFamily: "'Work Sans', sans-serif" }}>{gallery[index].caption}</div>
          </div>
        )}
      </div>

      {gallery.length > 1 && (
        <>
          <button onClick={() => goTo(index - 1)} aria-label="Previous photo" style={navArrowStyle("left")}>
            <ChevronRight size={18} style={{ transform: "rotate(180deg)" }} />
          </button>
          <button onClick={() => goTo(index + 1)} aria-label="Next photo" style={navArrowStyle("right")}>
            <ChevronRight size={18} />
          </button>
          <div style={{ position: "absolute", bottom: 12, left: 0, right: 0, display: "flex", justifyContent: "center", gap: 6 }}>
            {gallery.map((_, i) => (
              <button
                key={i}
                onClick={() => goTo(i)}
                aria-label={`Go to photo ${i + 1}`}
                style={{
                  width: i === index ? 18 : 7,
                  height: 7,
                  borderRadius: 4,
                  border: "none",
                  background: i === index ? C.gold : "rgba(255,255,255,0.6)",
                  cursor: "pointer",
                  padding: 0,
                  transition: "width 0.3s ease",
                }}
              />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// Converts a normal Google Drive "share" link (file or folder) into a direct-embeddable image URL.
// Leaves non-Drive URLs untouched. Requires the Drive file to be shared as "Anyone with the link can view".
function toDirectImageUrl(url) {
  if (!url) return url;
  const patterns = [
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/uc\?.*[?&]id=([a-zA-Z0-9_-]+)/,
    /drive\.google\.com\/thumbnail\?.*[?&]id=([a-zA-Z0-9_-]+)/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`;
  }
  return url;
}

function initials(name = "") {
  return name
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w[0]?.toUpperCase() || "")
    .join("");
}

function formatCountdown(ms) {
  if (ms < 0) ms = 0;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

const PRAYER_ORDER = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];

const DEFAULT_BOARD_CATEGORIES = ["Board of Directors", "Council of Elders", "Branch Executives", "Mission Board"];

function timeStrToDate(hhmm, base) {
  const [h, m] = hhmm.split(":").map((n) => parseInt(n, 10));
  const d = new Date(base);
  d.setHours(h, m, 0, 0);
  return d;
}

function ContactForm() {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [message, setMessage] = useState("");
  const [company, setCompany] = useState(""); // honeypot — real visitors never fill this in
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error
  const [errorMsg, setErrorMsg] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setErrorMsg("");
    if (company) return; // silently drop likely-bot submissions
    if (!name.trim() || !email.trim() || !message.trim()) {
      setErrorMsg("Please fill in your name, email, and message.");
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
      setErrorMsg("Please enter a valid email address.");
      return;
    }
    setStatus("sending");
    try {
      await window.firebaseDb.collection("contact_messages").add({
        name: name.trim(),
        email: email.trim(),
        message: message.trim(),
        read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setStatus("sent");
      setName("");
      setEmail("");
      setMessage("");
    } catch (err) {
      setStatus("error");
      setErrorMsg("Something went wrong sending your message — please try again, or email us directly.");
    }
  };

  const fieldStyle = {
    width: "100%",
    padding: "10px 12px",
    borderRadius: 4,
    border: "1px solid #ccc",
    fontSize: 14,
    boxSizing: "border-box",
    fontFamily: "'Work Sans', sans-serif",
  };

  if (status === "sent") {
    return (
      <div style={{ marginTop: 40, padding: 24, background: "#fff", borderRadius: 6, maxWidth: 480, marginLeft: "auto", marginRight: "auto" }}>
        <div style={{ fontFamily: "'Spectral', serif", fontSize: 18, color: C.teal, marginBottom: 6 }}>Message sent</div>
        <p style={{ fontSize: 14, color: C.sage, margin: 0 }}>Thank you for reaching out — we'll get back to you soon.</p>
      </div>
    );
  }

  return (
    <form
      onSubmit={submit}
      style={{ marginTop: 40, display: "flex", flexDirection: "column", gap: 12, maxWidth: 480, marginLeft: "auto", marginRight: "auto", textAlign: "left" }}
    >
      <input
        type="text"
        name="company"
        value={company}
        onChange={(e) => setCompany(e.target.value)}
        autoComplete="off"
        tabIndex={-1}
        style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }}
      />
      <input style={fieldStyle} placeholder="Your name" value={name} onChange={(e) => setName(e.target.value)} />
      <input style={fieldStyle} type="email" placeholder="Your email" value={email} onChange={(e) => setEmail(e.target.value)} />
      <textarea
        style={{ ...fieldStyle, minHeight: 110, resize: "vertical" }}
        placeholder="Your message"
        value={message}
        onChange={(e) => setMessage(e.target.value)}
      />
      {errorMsg && <div style={{ color: C.maroon, fontSize: 13 }}>{errorMsg}</div>}
      <button
        type="submit"
        disabled={status === "sending"}
        style={{
          background: C.teal,
          color: "#fff",
          border: "none",
          padding: "11px 20px",
          borderRadius: 4,
          cursor: status === "sending" ? "default" : "pointer",
          fontSize: 14,
          fontWeight: 600,
          opacity: status === "sending" ? 0.7 : 1,
        }}
      >
        {status === "sending" ? "Sending…" : "Send Message"}
      </button>
    </form>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(DEFAULT_DATA);
  const [events, setEvents] = useState([]);
  const [gallery, setGallery] = useState([]);
  const [board, setBoard] = useState([]);
  const [boardCategories, setBoardCategories] = useState(DEFAULT_BOARD_CATEGORIES);
  const [navOpen, setNavOpen] = useState(false);
  const [eventsView, setEventsView] = useState("upcoming"); // upcoming | past
  const [view, setView] = useState("site"); // site | admin
  const [authed, setAuthed] = useState(false);
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState("");
  const [saveMsg, setSaveMsg] = useState("");

  const [timings, setTimings] = useState(null);
  const [prayerError, setPrayerError] = useState("");
  const [prayerTz, setPrayerTz] = useState(null);
  const [prayerDateKey, setPrayerDateKey] = useState(null);
  const [now, setNow] = useState(new Date());

  // ---- timezone helpers: prayer times are calculated for the mosque's city,
  // so "now" needs to reflect that city's clock, not the visitor's browser clock ----
  const zonedNow = (tz) => {
    if (!tz) return new Date();
    try {
      return new Date(new Date().toLocaleString("en-US", { timeZone: tz }));
    } catch {
      return new Date();
    }
  };
  const dateKeyFor = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  // ---- load persisted data ----
  useEffect(() => {
    (async () => {
      try {
        const [siteRes, eventsRes, galleryRes, boardRes, boardCatRes] = await Promise.allSettled([
          window.storage.get("site-content", true),
          window.storage.get("events", true),
          window.storage.get("gallery", true),
          window.storage.get("board", true),
          window.storage.get("board-categories", true),
        ]);
        if (siteRes.status === "fulfilled" && siteRes.value) {
          setData({ ...DEFAULT_DATA, ...JSON.parse(siteRes.value.value) });
        } else {
          await window.storage.set("site-content", JSON.stringify(DEFAULT_DATA), true);
        }
        if (eventsRes.status === "fulfilled" && eventsRes.value) {
          setEvents(JSON.parse(eventsRes.value.value));
        }
        if (galleryRes.status === "fulfilled" && galleryRes.value) {
          setGallery(JSON.parse(galleryRes.value.value));
        }
        if (boardRes.status === "fulfilled" && boardRes.value) {
          setBoard(JSON.parse(boardRes.value.value));
        }
        if (boardCatRes.status === "fulfilled" && boardCatRes.value) {
          setBoardCategories(JSON.parse(boardCatRes.value.value));
        } else {
          await window.storage.set("board-categories", JSON.stringify(DEFAULT_BOARD_CATEGORIES), true);
        }
      } catch (e) {
        console.error("Load error", e);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // ---- tick clock, in the mosque's timezone once we know it ----
  useEffect(() => {
    setNow(zonedNow(prayerTz));
    const t = setInterval(() => setNow(zonedNow(prayerTz)), 1000);
    return () => clearInterval(t);
  }, [prayerTz]);

  // ---- fetch prayer times ----
  const fetchTimings = useCallback(() => {
    if (!data.prayerCity || !data.prayerCountry) return;
    setPrayerError("");
    const today = zonedNow(prayerTz);
    const dateStr = `${String(today.getDate()).padStart(2, "0")}-${String(today.getMonth() + 1).padStart(2, "0")}-${today.getFullYear()}`;
    fetch(
      `https://api.aladhan.com/v1/timingsByCity/${dateStr}?city=${encodeURIComponent(
        data.prayerCity
      )}&country=${encodeURIComponent(data.prayerCountry)}&method=${data.calcMethod || "2"}`
    )
      .then((r) => r.json())
      .then((json) => {
        if (json?.data?.timings) {
          const tz = json.data.meta?.timezone || null;
          setTimings(json.data.timings);
          setPrayerTz(tz);
          setPrayerDateKey(dateKeyFor(zonedNow(tz)));
        } else {
          setPrayerError("Couldn't load prayer times right now.");
        }
      })
      .catch(() => setPrayerError("Couldn't load prayer times right now."));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.prayerCity, data.prayerCountry, data.calcMethod]);

  useEffect(() => {
    setTimings(null);
    fetchTimings();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.prayerCity, data.prayerCountry, data.calcMethod]);

  // ---- re-fetch automatically once the calendar day rolls over in the mosque's timezone ----
  useEffect(() => {
    const t = setInterval(() => {
      const currentKey = dateKeyFor(zonedNow(prayerTz));
      if (prayerDateKey && currentKey !== prayerDateKey) {
        fetchTimings();
      }
    }, 60000);
    return () => clearInterval(t);
  }, [prayerTz, prayerDateKey, fetchTimings]);

  const nextPrayer = (() => {
    if (!timings) return null;
    const candidates = PRAYER_ORDER.map((name) => ({
      name,
      date: timeStrToDate(timings[name], now),
    }));
    let upcoming = candidates.find((c) => c.date.getTime() > now.getTime());
    if (!upcoming) {
      upcoming = { name: "Fajr", date: new Date(timeStrToDate(timings.Fajr, now).getTime() + 86400000) };
    }
    return upcoming;
  })();

  const scrollTo = (id) => {
    setNavOpen(false);
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
  };

  // "Board" isn't part of the scrolling homepage — it opens as its own page
  const goToNav = (label) => {
    if (label === "Board") {
      setNavOpen(false);
      setView("board");
    } else {
      scrollTo(label.toLowerCase());
    }
  };

  // ---- persistence helpers ----
  const persistSite = async (next) => {
    setData(next);
    try {
      await window.storage.set("site-content", JSON.stringify(next), true);
      flashSave();
    } catch (e) {
      console.error(e);
    }
  };
  const persistEvents = async (next) => {
    setEvents(next);
    try {
      await window.storage.set("events", JSON.stringify(next), true);
      flashSave();
    } catch (e) {
      console.error(e);
    }
  };
  const persistGallery = async (next) => {
    setGallery(next);
    try {
      await window.storage.set("gallery", JSON.stringify(next), true);
      flashSave();
    } catch (e) {
      console.error(e);
    }
  };
  const persistBoard = async (next) => {
    setBoard(next);
    try {
      await window.storage.set("board", JSON.stringify(next), true);
      flashSave();
    } catch (e) {
      console.error(e);
    }
  };
  const persistBoardCategories = async (next) => {
    setBoardCategories(next);
    try {
      await window.storage.set("board-categories", JSON.stringify(next), true);
      flashSave();
    } catch (e) {
      console.error(e);
    }
  };
  const flashSave = () => {
    setSaveMsg("Saved");
    setTimeout(() => setSaveMsg(""), 1500);
  };

  // ---- admin auth (Firebase Authentication) ----
  const tryLogin = async () => {
    setPwError("");
    try {
      await window.firebaseAuth.signInWithEmailAndPassword(window.ADMIN_EMAIL, pwInput);
      setAuthed(true);
      setPwInput("");
    } catch (e) {
      const code = e && e.code ? e.code : "unknown-error";
      const messages = {
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-credential": "Incorrect password.",
        "auth/user-not-found": "No admin account found with that email — check the Firebase console.",
        "auth/operation-not-allowed": "Email/Password sign-in isn't enabled in Firebase yet.",
        "auth/network-request-failed": "Network error — check your connection and try again.",
        "auth/too-many-requests": "Too many attempts — wait a bit and try again.",
      };
      setPwError(messages[code] || `Login failed (${code}).`);
    }
  };

  const todayStart = new Date(new Date().toDateString());
  const upcomingEvents = [...events]
    .filter((e) => !e.date || new Date(e.date) >= todayStart)
    .sort((a, b) => new Date(a.date) - new Date(b.date)); // soonest first
  const pastEvents = [...events]
    .filter((e) => e.date && new Date(e.date) < todayStart)
    .sort((a, b) => new Date(b.date) - new Date(a.date)); // most recent first
  const shownEvents = eventsView === "upcoming" ? upcomingEvents : pastEvents;

  if (loading) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.stone }}>
        <style>{FONTS}</style>
        <Star size={40} color={C.gold} />
      </div>
    );
  }

  if (view === "board") {
    return <BoardPage data={data} board={board} boardCategories={boardCategories} onBack={() => setView("site")} />;
  }

  if (view === "admin") {
    return (
      <AdminPanel
        authed={authed}
        pwInput={pwInput}
        setPwInput={setPwInput}
        pwError={pwError}
        tryLogin={tryLogin}
        onExit={() => {
          setView("site");
          setAuthed(false);
          window.firebaseAuth.signOut();
        }}
        data={data}
        persistSite={persistSite}
        events={events}
        persistEvents={persistEvents}
        gallery={gallery}
        persistGallery={persistGallery}
        board={board}
        persistBoard={persistBoard}
        boardCategories={boardCategories}
        persistBoardCategories={persistBoardCategories}
        saveMsg={saveMsg}
      />
    );
  }

  return (
    <div style={{ fontFamily: "'Work Sans', sans-serif", color: C.ink, background: C.stone, minHeight: "100vh" }}>
      <style>{FONTS}</style>

      {/* NAV */}
      <nav
        style={{
          position: "sticky",
          top: 0,
          zIndex: 50,
          background: C.teal,
          color: C.stone,
          boxShadow: "0 2px 12px rgba(0,0,0,0.15)",
        }}
      >
        <div style={{ maxWidth: 1120, margin: "0 auto", padding: "0 20px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, fontFamily: "'Spectral', serif", fontSize: 20, fontWeight: 600 }}>
            <img src={LOGO_DATA_URI} alt="NASFAT logo" style={{ height: 40, width: "auto", borderRadius: 3 }} />
            {data.orgName}
          </div>
          <div className="hidden md:flex" style={{ display: "none", gap: 28 }} id="desktop-nav">
            {["Home", "About", "Board", "Events", "Gallery", "Donate", "Prayer", "Contact"].map((label) => (
              <button
                key={label}
                onClick={() => goToNav(label)}
                style={{ background: "none", border: "none", color: C.stone, fontSize: 14, letterSpacing: "0.03em", cursor: "pointer", fontFamily: "'Work Sans', sans-serif" }}
              >
                {label}
              </button>
            ))}
          </div>
          <button onClick={() => setNavOpen(!navOpen)} style={{ background: "none", border: "none", color: C.stone, cursor: "pointer" }} className="md:hidden">
            {navOpen ? <X size={24} /> : <Menu size={24} />}
          </button>
        </div>
        {navOpen && (
          <div style={{ background: C.tealDeep, padding: "10px 20px 20px", display: "flex", flexDirection: "column", gap: 4 }}>
            {["Home", "About", "Board", "Events", "Gallery", "Donate", "Prayer", "Contact"].map((label) => (
              <button
                key={label}
                onClick={() => goToNav(label)}
                style={{ background: "none", border: "none", color: C.stone, fontSize: 15, textAlign: "left", padding: "10px 0", cursor: "pointer" }}
              >
                {label}
              </button>
            ))}
          </div>
        )}
      </nav>

      {/* HERO */}
      <header id="home" style={{ position: "relative", background: `radial-gradient(ellipse at top, ${C.teal}, ${C.tealDeep})`, color: C.stone, padding: "0 20px", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, opacity: 0.08, backgroundImage: `radial-gradient(${C.gold} 1px, transparent 1px)`, backgroundSize: "28px 28px" }} />
        <div style={{ maxWidth: 780, margin: "0 auto", padding: "96px 0 88px", textAlign: "center", position: "relative" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 22 }}>
            <img src={LOGO_DATA_URI} alt="NASFAT logo" style={{ height: 84, width: "auto", borderRadius: 6, boxShadow: "0 8px 30px rgba(0,0,0,0.35)" }} />
          </div>
          <Eyebrow>As-salamu alaykum</Eyebrow>
          <h1 style={{ fontFamily: "'Spectral', serif", fontSize: "clamp(32px, 5vw, 52px)", fontWeight: 600, lineHeight: 1.15, margin: "0 0 18px" }}>
            {data.heroTagline}
          </h1>
          <p style={{ color: C.goldLight, fontSize: 16, maxWidth: 520, margin: "0 auto 40px" }}>
            {data.orgName} welcomes you — for prayer, for community, for growth.
          </p>

          {nextPrayer && (
            <div style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", background: "rgba(255,255,255,0.06)", border: `1px solid rgba(216,174,108,0.3)`, borderRadius: 4, padding: "20px 32px", marginBottom: 36 }}>
              <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, letterSpacing: "0.14em", color: C.goldLight, textTransform: "uppercase", marginBottom: 8 }}>
                Next Prayer — {nextPrayer.name}
              </div>
              <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 32, fontWeight: 700, color: C.stone }}>
                {formatCountdown(nextPrayer.date.getTime() - now.getTime())}
              </div>
            </div>
          )}

          <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }}>
            <button
              onClick={() => scrollTo("donate")}
              style={{ display: "inline-flex", alignItems: "center", gap: 8, background: C.gold, color: C.ink, padding: "13px 28px", borderRadius: 3, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14 }}
            >
              <Heart size={16} /> Donate
            </button>
            <button
              onClick={() => scrollTo("prayer")}
              style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "transparent", color: C.stone, border: `1px solid rgba(243,240,230,0.35)`, padding: "13px 28px", borderRadius: 3, cursor: "pointer", fontSize: 14 }}
            >
              <Clock size={16} /> Prayer Times
            </button>
          </div>
        </div>
      </header>

      {/* ABOUT */}
      <section id="about" style={{ maxWidth: 1120, margin: "0 auto", padding: "88px 20px" }}>
        <div style={{ textAlign: "center", maxWidth: 640, margin: "0 auto" }}>
          <Eyebrow>About Us</Eyebrow>
          <h2 style={{ fontFamily: "'Spectral', serif", fontSize: 32, fontWeight: 600, margin: "0 0 24px" }}>Our Community</h2>
        </div>
        <Divider />
        <p style={{ maxWidth: 700, margin: "0 auto", fontSize: 17, lineHeight: 1.8, color: C.ink, textAlign: "center" }}>{data.about}</p>
      </section>

      {/* EVENTS */}
      <section id="events" style={{ background: C.stoneDim, padding: "88px 20px" }}>
        <div style={{ maxWidth: 1120, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 12 }}>
            <Eyebrow>What's Happening</Eyebrow>
            <h2 style={{ fontFamily: "'Spectral', serif", fontSize: 32, fontWeight: 600, margin: 0 }}>
              {eventsView === "upcoming" ? "Upcoming Events" : "Past Events"}
            </h2>
          </div>
          <Divider />

          <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 32, marginTop: -24 }}>
            {[
              { id: "upcoming", label: `Upcoming (${upcomingEvents.length})` },
              { id: "past", label: `Past (${pastEvents.length})` },
            ].map((t) => (
              <button
                key={t.id}
                onClick={() => setEventsView(t.id)}
                style={{
                  background: eventsView === t.id ? C.teal : "transparent",
                  color: eventsView === t.id ? C.stone : C.sage,
                  border: `1px solid ${eventsView === t.id ? C.teal : C.stoneDim}`,
                  borderRadius: 20,
                  padding: "7px 18px",
                  fontSize: 13,
                  fontWeight: 600,
                  cursor: "pointer",
                  fontFamily: "'Work Sans', sans-serif",
                }}
              >
                {t.label}
              </button>
            ))}
          </div>

          {shownEvents.length === 0 ? (
            <p style={{ textAlign: "center", color: C.sage }}>
              {eventsView === "upcoming" ? "No upcoming events posted yet — check back soon." : "No past events on record yet."}
            </p>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 24 }}>
              {shownEvents.map((ev, i) => (
                <div
                  key={i}
                  style={{
                    background: C.stone,
                    borderRadius: 4,
                    padding: 24,
                    borderLeft: `3px solid ${eventsView === "upcoming" ? C.gold : C.sage}`,
                    opacity: eventsView === "past" ? 0.85 : 1,
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: "'Space Mono', monospace", fontSize: 12, color: C.maroon, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                    <Calendar size={14} />
                    {ev.date ? new Date(ev.date).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) : "Date TBA"}
                    {ev.time ? ` · ${ev.time}` : ""}
                  </div>
                  <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 20, fontWeight: 600, margin: "0 0 8px" }}>{ev.title}</h3>
                  {ev.location && (
                    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: C.sage, marginBottom: 8 }}>
                      <MapPin size={13} /> {ev.location}
                    </div>
                  )}
                  <p style={{ fontSize: 14, lineHeight: 1.6, color: C.ink, margin: 0 }}>{ev.description}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </section>

      {/* GALLERY */}
      <section id="gallery" style={{ maxWidth: 1120, margin: "0 auto", padding: "88px 20px" }}>
        <div style={{ textAlign: "center", marginBottom: 12 }}>
          <Eyebrow>Moments</Eyebrow>
          <h2 style={{ fontFamily: "'Spectral', serif", fontSize: 32, fontWeight: 600, margin: 0 }}>Photo Gallery</h2>
        </div>
        <Divider />
        {gallery.length === 0 ? (
          <p style={{ textAlign: "center", color: C.sage }}>Photos coming soon.</p>
        ) : (
          <GalleryCarousel gallery={gallery} />
        )}
      </section>

      {/* DONATE */}
      <section id="donate" style={{ background: `linear-gradient(135deg, ${C.teal}, ${C.tealDeep})`, color: C.stone, padding: "88px 20px" }}>
        <div style={{ maxWidth: 640, margin: "0 auto", textAlign: "center" }}>
          <Star size={32} color={C.gold} />
          <h2 style={{ fontFamily: "'Spectral', serif", fontSize: 32, fontWeight: 600, margin: "20px 0 16px" }}>Support Our Work</h2>
          <p style={{ fontSize: 16, lineHeight: 1.7, color: C.goldLight, marginBottom: 32 }}>{data.donateNote}</p>
          {(() => {
            const options = [
              { amount: "$25", url: data.donateUrl25 },
              { amount: "$50", url: data.donateUrl50 },
              { amount: "$100", url: data.donateUrl100 },
              { amount: "Custom Amount", url: data.donateUrlCustom },
            ].filter((o) => o.url);
            if (options.length === 0) {
              return <p style={{ fontSize: 14, color: C.goldLight }}>Online giving is being set up — please check back soon.</p>;
            }
            return (
              <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
                {options.map((o) => (
                  <a
                    key={o.amount}
                    href={o.url}
                    target="_blank"
                    rel="noreferrer"
                    style={{
                      display: "inline-flex",
                      alignItems: "center",
                      gap: 8,

          <div style={{ display: "flex", flexDirection: "column", gap: 16, alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
              <MapPin size={16} color={C.gold} /> {data.address}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
              <Mail size={16} color={C.gold} />
              <a href={`mailto:${data.email}`} style={{ color: C.ink }}>{data.email}</a>

            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
              <Phone size={16} color={C.gold} />
              <a href={`tel:${data.phone}`} style={{ color: C.ink }}>{data.phone}</a>
            </div>

      {/* FOOTER */}
      <footer style={{ background: C.tealDeep, color: C.stone, padding: "32px 20px", textAlign: "center", fontSize: 13 }}>
        <div style={{ marginBottom: 8, opacity: 0.75 }}>© {new Date().getFullYear()} {data.orgName}</div>
        <button onClick={() => setView("admin")} style={{ background: "none", border: "none", color: C.goldLight, fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>

}

function AdminPanel({
  authed,
  pwInput,
  setPwInput,
  pwError,
  tryLogin,
  onExit,
  data,
  persistSite,
  events,
  persistEvents,
  gallery,
  persistGallery,
  board,
  persistBoard,
  boardCategories,
  persistBoardCategories,
  saveMsg,
}) {
  const [tab, setTab] = useState("site");
  const [form, setForm] = useState(data);
  const [newEvent, setNewEvent] = useState({ title: "", date: "", time: "", location: "", description: "" });
  const [newPhoto, setNewPhoto] = useState({ url: "", caption: "" });
  const [newMember, setNewMember] = useState({ name: "", role: "", category: boardCategories[0] || "" });
  const [newCategory, setNewCategory] = useState("");
  const [categoryMsg, setCategoryMsg] = useState("");
  const [messages, setMessages] = useState([]);
  const [messagesLoading, setMessagesLoading] = useState(false);

  useEffect(() => {
    if (tab !== "messages") return;
    setMessagesLoading(true);
    window.firebaseDb
      .collection("contact_messages")
      .orderBy("createdAt", "desc")
      .get()
      .then((snap) => {
        setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      })
      .catch((e) => console.error("Failed to load messages", e))
      .finally(() => setMessagesLoading(false));
  }, [tab]);

  const deleteMessage = async (id) => {
    try {
      await window.firebaseDb.collection("contact_messages").doc(id).delete();
      setMessages((msgs) => msgs.filter((m) => m.id !== id));
    } catch (e) {
      console.error("Failed to delete message", e);
    }
  };

  useEffect(() => setForm(data), [data]);

  // keep the "add member" category selection valid if sections change elsewhere
  useEffect(() => {
    if (boardCategories.length && !boardCategories.includes(newMember.category)) {
      setNewMember((m) => ({ ...m, category: boardCategories[0] }));
    }
  }, [boardCategories]); // eslint-disable-line react-hooks/exhaustive-deps

  const addCategory = () => {
    const name = newCategory.trim();
    setCategoryMsg("");
    if (!name) return;
    if (boardCategories.some((c) => c.toLowerCase() === name.toLowerCase())) {
      setCategoryMsg(`"${name}" already exists.`);
      return;
    }
    persistBoardCategories([...boardCategories, name]);
    setNewCategory("");
  };

  const removeCategory = (cat) => {
    setCategoryMsg("");
    const inUse = board.some((m) => m.category === cat);
    if (inUse) {
      setCategoryMsg(`Remove or reassign members under "${cat}" before deleting that section.`);
      return;
    }
    persistBoardCategories(boardCategories.filter((c) => c !== cat));
  };

  if (!authed) {
    return (
      <div style={{ minHeight: "100vh", background: C.stone, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Work Sans', sans-serif", padding: 20 }}>
        <style>{FONTS}</style>
        <div style={{ background: "#fff", borderRadius: 6, padding: 36, width: 340, boxShadow: "0 4px 24px rgba(0,0,0,0.1)" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <Lock size={28} color={C.teal} />
          </div>
          <h2 style={{ fontFamily: "'Spectral', serif", textAlign: "center", fontSize: 22, margin: "0 0 20px" }}>Admin Login</h2>
          <input
            type="password"
            value={pwInput}
            onChange={(e) => setPwInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && tryLogin()}
            placeholder="Password"
            style={{ width: "100%", padding: "10px 12px", borderRadius: 4, border: "1px solid #ccc", marginBottom: 12, fontSize: 14, boxSizing: "border-box" }}
          />
          {pwError && <div style={{ color: C.maroon, fontSize: 13, marginBottom: 12 }}>{pwError}</div>}
          <button onClick={tryLogin} style={{ width: "100%", background: C.teal, color: "#fff", border: "none", padding: 11, borderRadius: 4, cursor: "pointer", fontSize: 14, fontWeight: 600 }}>
            Log In
          </button>
          <button onClick={onExit} style={{ display: "block", margin: "18px auto 0", background: "none", border: "none", color: C.sage, fontSize: 13, cursor: "pointer" }}>
            ← Back to site
          </button>
        </div>
      </div>
    );
  }

  const inputStyle = { width: "100%", padding: "9px 11px", borderRadius: 4, border: "1px solid #ccc", fontSize: 14, boxSizing: "border-box", fontFamily: "'Work Sans', sans-serif" };
  const labelStyle = { fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 5, display: "block" };

  const tabs = [
    { id: "site", label: "Site Info" },
    { id: "donate", label: "Donate" },
    { id: "prayer", label: "Prayer Settings" },
    { id: "board", label: "Board" },
    { id: "events", label: "Events" },
    { id: "gallery", label: "Gallery" },
    { id: "messages", label: "Messages" },
    { id: "account", label: "Account" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: C.stone, fontFamily: "'Work Sans', sans-serif", color: C.ink }}>
      <style>{FONTS}</style>
      <div style={{ background: C.tealDeep, color: "#fff", padding: "16px 24px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontFamily: "'Spectral', serif", fontSize: 18 }}>Admin — {data.orgName}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          {saveMsg && <span style={{ fontSize: 12, color: C.goldLight }}>{saveMsg}</span>}
          <button onClick={onExit} style={{ background: "none", border: "1px solid rgba(255,255,255,0.3)", color: "#fff", padding: "7px 14px", borderRadius: 4, cursor: "pointer", fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
            <LogOut size={14} /> Exit
          </button>
        </div>
      </div>

      <div style={{ maxWidth: 1000, margin: "0 auto", padding: "24px 20px", display: "flex", gap: 24 }}>
        <div style={{ minWidth: 160, display: "flex", flexDirection: "column", gap: 4 }}>
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                textAlign: "left",
                background: tab === t.id ? C.teal : "transparent",
                color: tab === t.id ? "#fff" : C.ink,
                border: "none",
                padding: "10px 12px",
                borderRadius: 4,
                cursor: "pointer",
                fontSize: 14,
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        <div style={{ flex: 1, background: "#fff", borderRadius: 6, padding: 28 }}>
          {tab === "site" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div>
                <label style={labelStyle}>Organization Name</label>
                <input style={inputStyle} value={form.orgName} onChange={(e) => setForm({ ...form, orgName: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Hero Tagline</label>
                <input style={inputStyle} value={form.heroTagline} onChange={(e) => setForm({ ...form, heroTagline: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>About Text</label>
                <textarea rows={5} style={{ ...inputStyle, resize: "vertical" }} value={form.about} onChange={(e) => setForm({ ...form, about: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Address</label>
                <input style={inputStyle} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Email</label>
                <input style={inputStyle} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Phone</label>
                <input style={inputStyle} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
              </div>
              <SaveBtn onClick={() => persistSite(form)} />
            </div>
          )}

          {tab === "donate" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <p style={{ fontSize: 13, color: C.sage, marginTop: -4 }}>
                Create a separate Stripe Payment Link for each amount (Stripe Dashboard → Payment Links). Cards, Apple Pay,
                and Google Pay are included automatically — nothing extra to configure. Leave any field blank to hide that
                button.
              </p>
              <div>
                <label style={labelStyle}>Stripe Link — $25</label>
                <input style={inputStyle} value={form.donateUrl25} onChange={(e) => setForm({ ...form, donateUrl25: e.target.value })} placeholder="https://buy.stripe.com/..." />
              </div>
              <div>
                <label style={labelStyle}>Stripe Link — $50</label>
                <input style={inputStyle} value={form.donateUrl50} onChange={(e) => setForm({ ...form, donateUrl50: e.target.value })} placeholder="https://buy.stripe.com/..." />
              </div>
              <div>
                <label style={labelStyle}>Stripe Link — $100</label>
                <input style={inputStyle} value={form.donateUrl100} onChange={(e) => setForm({ ...form, donateUrl100: e.target.value })} placeholder="https://buy.stripe.com/..." />
              </div>
              <div>
                <label style={labelStyle}>Stripe Link — Custom Amount</label>
                <input style={inputStyle} value={form.donateUrlCustom} onChange={(e) => setForm({ ...form, donateUrlCustom: e.target.value })} placeholder="https://buy.stripe.com/..." />
              </div>
              <div>
                <label style={labelStyle}>Donate Section Note</label>
                <textarea rows={3} style={{ ...inputStyle, resize: "vertical" }} value={form.donateNote} onChange={(e) => setForm({ ...form, donateNote: e.target.value })} />
              </div>
              <SaveBtn onClick={() => persistSite(form)} />
            </div>
          )}

          {tab === "prayer" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div>
                <label style={labelStyle}>City</label>
                <input style={inputStyle} value={form.prayerCity} onChange={(e) => setForm({ ...form, prayerCity: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Country (or country code)</label>
                <input style={inputStyle} value={form.prayerCountry} onChange={(e) => setForm({ ...form, prayerCountry: e.target.value })} />
              </div>
              <div>
                <label style={labelStyle}>Calculation Method (leave 2 for ISNA — ask your imam if unsure)</label>
                <input style={inputStyle} value={form.calcMethod} onChange={(e) => setForm({ ...form, calcMethod: e.target.value })} />
              </div>
              <SaveBtn onClick={() => persistSite(form)} />
            </div>
          )}

          {tab === "board" && (
            <div>
              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18, marginTop: 0 }}>Sections</h3>
              <p style={{ fontSize: 13, color: C.sage, marginTop: -8, marginBottom: 14 }}>
                Add as many sections as you like (e.g. "Youth Committee", "Sisters' Wing") — each one shows up on the Board page once it has at least one member.
              </p>
              <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
                <input
                  style={{ ...inputStyle, flex: 1, minWidth: 200 }}
                  placeholder="New section name"
                  value={newCategory}
                  onChange={(e) => setNewCategory(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addCategory()}
                />
                <button
                  onClick={addCategory}
                  style={{ display: "flex", alignItems: "center", gap: 6, background: C.gold, color: C.ink, border: "none", padding: "9px 16px", borderRadius: 4, cursor: "pointer", fontSize: 13, fontWeight: 600 }}
                >
                  <Plus size={15} /> Add Section
                </button>
              </div>
              {categoryMsg && <div style={{ fontSize: 13, color: C.maroon, marginBottom: 14 }}>{categoryMsg}</div>}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 28 }}>
                {boardCategories.map((cat) => (
                  <div
                    key={cat}
                    style={{ display: "flex", alignItems: "center", gap: 4, background: C.stoneDim, borderRadius: 20, padding: "6px 6px 6px 14px", fontSize: 13 }}
                  >
                    {cat}
                    <button
                      onClick={() => removeCategory(cat)}
                      aria-label={`Remove ${cat}`}
                      style={{ background: "none", border: "none", color: C.maroon, cursor: "pointer", display: "flex", alignItems: "center", padding: 4 }}
                    >
                      <Trash2 size={13} />
                    </button>
                  </div>
                ))}
              </div>

              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18 }}>Add Member</h3>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                <input style={inputStyle} placeholder="Full name" value={newMember.name} onChange={(e) => setNewMember({ ...newMember, name: e.target.value })} />
                <input style={inputStyle} placeholder="Title (e.g. President, Secretary)" value={newMember.role} onChange={(e) => setNewMember({ ...newMember, role: e.target.value })} />
                <select
                  style={{ ...inputStyle, gridColumn: "1 / -1" }}
                  value={newMember.category}
                  onChange={(e) => setNewMember({ ...newMember, category: e.target.value })}
                >
                  {boardCategories.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </div>
              <button
                onClick={() => {
                  if (!newMember.name || !newMember.category) return;
                  persistBoard([...board, newMember]);
                  setNewMember({ name: "", role: "", category: newMember.category });
                }}
                style={{ display: "flex", alignItems: "center", gap: 6, background: C.gold, color: C.ink, border: "none", padding: "9px 16px", borderRadius: 4, cursor: "pointer", fontSize: 13, fontWeight: 600, marginBottom: 24 }}
              >
                <Plus size={15} /> Add Member
              </button>

              {boardCategories.map((cat) => {
                const members = board.filter((m) => m.category === cat);
                return (
                  <div key={cat} style={{ marginBottom: 20 }}>
                    <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 16, marginBottom: 6 }}>{cat}</h3>
                    {members.length === 0 && <p style={{ color: C.sage, fontSize: 13 }}>No members added yet.</p>}
                    {members.map((m) => {
                      const idx = board.indexOf(m);
                      return (
                        <div key={idx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #eee" }}>
                          <div>
                            <div style={{ fontWeight: 600, fontSize: 14 }}>{m.name}</div>
                            {m.role && <div style={{ fontSize: 12, color: C.sage }}>{m.role}</div>}
                          </div>
                          <button onClick={() => persistBoard(board.filter((_, i) => i !== idx))} style={{ background: "none", border: "none", color: C.maroon, cursor: "pointer" }}>
                            <Trash2 size={16} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )}

          {tab === "events" && (
            <div>
              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18, marginTop: 0 }}>Add Event</h3>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                <input style={inputStyle} placeholder="Title" value={newEvent.title} onChange={(e) => setNewEvent({ ...newEvent, title: e.target.value })} />
                <input type="date" style={inputStyle} value={newEvent.date} onChange={(e) => setNewEvent({ ...newEvent, date: e.target.value })} />
                <input style={inputStyle} placeholder="Time (e.g. 6:00 PM)" value={newEvent.time} onChange={(e) => setNewEvent({ ...newEvent, time: e.target.value })} />
                <input style={inputStyle} placeholder="Location" value={newEvent.location} onChange={(e) => setNewEvent({ ...newEvent, location: e.target.value })} />
              </div>
              <textarea style={{ ...inputStyle, marginBottom: 12, resize: "vertical" }} rows={3} placeholder="Description" value={newEvent.description} onChange={(e) => setNewEvent({ ...newEvent, description: e.target.value })} />
              <button
                onClick={() => {
                  if (!newEvent.title) return;
                  persistEvents([...events, newEvent]);
                  setNewEvent({ title: "", date: "", time: "", location: "", description: "" });
                }}
                style={{ display: "flex", alignItems: "center", gap: 6, background: C.gold, color: C.ink, border: "none", padding: "9px 16px", borderRadius: 4, cursor: "pointer", fontSize: 13, fontWeight: 600, marginBottom: 24 }}
              >
                <Plus size={15} /> Add Event
              </button>

              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18 }}>Current Events</h3>
              {events.length === 0 && <p style={{ color: C.sage, fontSize: 14 }}>No events yet.</p>}
              {events.map((ev, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #eee" }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{ev.title}</div>
                    <div style={{ fontSize: 12, color: C.sage }}>{ev.date} {ev.time}</div>
                  </div>
                  <button onClick={() => persistEvents(events.filter((_, idx) => idx !== i))} style={{ background: "none", border: "none", color: C.maroon, cursor: "pointer" }}>
                    <Trash2 size={16} />
                  </button>
                </div>
              ))}
            </div>
          )}

          {tab === "gallery" && (
            <div>
              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18, marginTop: 0 }}>Add Photo</h3>
              <p style={{ fontSize: 13, color: C.sage, marginTop: -8, marginBottom: 14 }}>
                Paste a direct image link (Google Photos, Imgur, your own hosting), or a Google Drive share link —
                just make sure the Drive file's sharing is set to "Anyone with the link can view."
              </p>
              <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
                <input style={{ ...inputStyle, flex: 2, minWidth: 200 }} placeholder="Image URL or Google Drive link" value={newPhoto.url} onChange={(e) => setNewPhoto({ ...newPhoto, url: e.target.value })} />
                <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} placeholder="Caption (optional)" value={newPhoto.caption} onChange={(e) => setNewPhoto({ ...newPhoto, caption: e.target.value })} />
              </div>
              <button
                onClick={() => {
                  if (!newPhoto.url) return;
                  persistGallery([...gallery, { ...newPhoto, url: toDirectImageUrl(newPhoto.url) }]);
                  setNewPhoto({ url: "", caption: "" });
                }}
                style={{ display: "flex", alignItems: "center", gap: 6, background: C.gold, color: C.ink, border: "none", padding: "9px 16px", borderRadius: 4, cursor: "pointer", fontSize: 13, fontWeight: 600, marginBottom: 24 }}
              >
                <Plus size={15} /> Add Photo
              </button>

              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18 }}>Current Photos</h3>
              {gallery.length === 0 && <p style={{ color: C.sage, fontSize: 14 }}>No photos yet.</p>}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 12 }}>
                {gallery.map((g, i) => (
                  <div key={i} style={{ position: "relative" }}>
                    <img src={g.url} alt="" style={{ width: "100%", height: 90, objectFit: "cover", borderRadius: 4 }} />
                    <button
                      onClick={() => persistGallery(gallery.filter((_, idx) => idx !== i))}
                      style={{ position: "absolute", top: 4, right: 4, background: "rgba(122,46,46,0.9)", border: "none", borderRadius: 3, color: "#fff", cursor: "pointer", padding: 4 }}
                    >
                      <Trash2 size={13} />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === "messages" && (
            <div>
              <h3 style={{ fontFamily: "'Spectral', serif", fontSize: 18, marginTop: 0 }}>Messages from the Contact form</h3>
              {messagesLoading && <p style={{ color: C.sage, fontSize: 14 }}>Loading…</p>}
              {!messagesLoading && messages.length === 0 && <p style={{ color: C.sage, fontSize: 14 }}>No messages yet.</p>}
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {messages.map((m) => (
                  <div key={m.id} style={{ background: "#fff", border: "1px solid #e6e2d4", borderRadius: 6, padding: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14 }}>{m.name}</div>
                        <a href={`mailto:${m.email}`} style={{ fontSize: 13, color: C.teal }}>{m.email}</a>
                        {m.createdAt && m.createdAt.toDate && (
                          <div style={{ fontSize: 12, color: C.sage, marginTop: 2 }}>{m.createdAt.toDate().toLocaleString()}</div>
                        )}
                      </div>
                      <button
                        onClick={() => deleteMessage(m.id)}
                        style={{ background: "none", border: "none", color: C.maroon, cursor: "pointer", padding: 4 }}
                        title="Delete message"
                      >
                        <Trash2 size={16} />
                      </button>
                    </div>
                    <p style={{ fontSize: 14, marginTop: 10, marginBottom: 0, whiteSpace: "pre-wrap" }}>{m.message}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === "account" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 420 }}>
              <p style={{ fontSize: 14 }}>
                Admin sign-in is managed through Firebase Authentication, not this page.
              </p>
              <p style={{ fontSize: 13, color: C.sage }}>
                To change the admin password, go to the Firebase console → Authentication → Users, select the admin
                account, and reset the password there. Changes take effect immediately — no need to re-publish the site.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SaveBtn({ onClick, label = "Save Changes" }) {
  return (
    <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 7, background: C.teal, color: "#fff", border: "none", padding: "10px 20px", borderRadius: 4, cursor: "pointer", fontSize: 14, fontWeight: 600, width: "fit-content" }}>
      <Save size={15} /> {label}
    </button>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
